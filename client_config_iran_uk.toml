# │ SETUP_PACKET_DUPLICATION_COUNT = 4                                       │
# │ ARQ_INITIAL_RTO_SECONDS        = 0.15                                    │
# │ SESSION_INIT_RACING_COUNT      = 5  (already set in this file)           │
# ├──────────────────────────────────────────────────────────────────────────┤
