# Faster and lighter than the above settings, especially for weak clients and servers!

# I don't think we can get anything more optimized, low-consumption, and faster than this 😁🫡

# I also increased the server-side settings for you above.

# ==============================================================================
# MasterDnsVPN Go Client Configuration (Final Balanced Profile)
# Optimized for: Maximum Speed, High Stability, Low Resources
# Strategy: Restore safe MTU (50/900), Increase Workers (4) for speed, Keep Duplication (2).
# ==============================================================================
# ------------------------------------------------------------------------------
# 1) Tunnel Identity & Security
# ------------------------------------------------------------------------------
DOMAINS = [""]
DATA_ENCRYPTION_METHOD = 1
ENCRYPTION_KEY = ""
# ------------------------------------------------------------------------------
# 2) Local Proxy Listener
# ------------------------------------------------------------------------------
PROTOCOL_TYPE = "SOCKS5"
LISTEN_IP = "0.0.0.0"
LISTEN_PORT = 1080
SOCKS5_AUTH = false
SOCKS5_USER = ""
SOCKS5_PASS = ""
# ------------------------------------------------------------------------------
# 3) Local DNS Service
# ------------------------------------------------------------------------------
LOCAL_DNS_ENABLED = true
LOCAL_DNS_IP = "127.0.0.1"
LOCAL_DNS_PORT = 53
LOCAL_DNS_CACHE_MAX_RECORDS = 5000
LOCAL_DNS_CACHE_TTL_SECONDS = 14400.0
LOCAL_DNS_PENDING_TIMEOUT_SECONDS = 120.0
DNS_RESPONSE_FRAGMENT_TIMEOUT_SECONDS = 60.0
LOCAL_DNS_CACHE_PERSIST_TO_FILE = true
LOCAL_DNS_CACHE_FLUSH_INTERVAL_SECONDS = 60.0
# ------------------------------------------------------------------------------
# 4) Resolver Selection, Duplication, and Health
# ------------------------------------------------------------------------------
RESOLVER_BALANCING_STRATEGY = 3
# [Critical] Kept at 2 for maximum stability.
PACKET_DUPLICATION_COUNT = 2
SETUP_PACKET_DUPLICATION_COUNT = 2
STREAM_RESOLVER_FAILOVER_RESEND_THRESHOLD = 5
STREAM_RESOLVER_FAILOVER_COOLDOWN = 15.0
RECHECK_INACTIVE_SERVERS_ENABLED = true
RECHECK_INACTIVE_INTERVAL_SECONDS = 60.0
RECHECK_SERVER_INTERVAL_SECONDS = 5.0
RECHECK_BATCH_SIZE = 36
AUTO_DISABLE_TIMEOUT_SERVERS = true
AUTO_DISABLE_TIMEOUT_WINDOW_SECONDS = 180.0
AUTO_DISABLE_MIN_OBSERVATIONS = 5
AUTO_DISABLE_CHECK_INTERVAL_SECONDS = 10.0
BASE_ENCODE_DATA = false
# ------------------------------------------------------------------------------
# 5) Compression
# ------------------------------------------------------------------------------
UPLOAD_COMPRESSION_TYPE = 1
DOWNLOAD_COMPRESSION_TYPE = 1
# Slightly increased to reduce overhead on tiny packets without hurting performance.
COMPRESSION_MIN_SIZE = 150
# ------------------------------------------------------------------------------
# 6) MTU Discovery
# [CRITICAL FIX] Reverted to the values that proved stable before (50/900).
# This ensures no fragmentation drops and max compatibility.
MIN_UPLOAD_MTU = 40
MIN_DOWNLOAD_MTU = 800
MAX_UPLOAD_MTU = 50
MAX_DOWNLOAD_MTU = 900
MTU_TEST_RETRIES = 2
MTU_TEST_TIMEOUT = 2.0
MTU_TEST_PARALLELISM = 150
SAVE_MTU_SERVERS_TO_FILE = false
MTU_SERVERS_FILE_NAME = "masterdnsvpn_success_test_{time}.log"
MTU_SERVERS_FILE_FORMAT = "{IP} - UP: {UP_MTU} DOWN: {DOWN-MTU}"
MTU_USING_SECTION_SEPARATOR_TEXT = ""
MTU_REMOVED_SERVER_LOG_FORMAT = "Resolver {IP} removed at {TIME} due to {CAUSE}"
MTU_ADDED_SERVER_LOG_FORMAT = "Resolver {IP} added back at {TIME} (UP {UP_MTU}, DOWN {DOWN_MTU})"
# ------------------------------------------------------------------------------
# 7) Runtime Workers, Queues, and Timers
# [Optimization] Restored Workers to 4 for maximum processing speed.
RX_TX_WORKERS = 4
TUNNEL_PROCESS_WORKERS = 4
TUNNEL_PACKET_TIMEOUT_SECONDS = 10.0
DISPATCHER_IDLE_POLL_INTERVAL_SECONDS = 0.030
# Reduced channel sizes slightly to save RAM but keep them high enough for speed.
TX_CHANNEL_SIZE = 3000
RX_CHANNEL_SIZE = 3000
RESOLVER_UDP_CONNECTION_POOL_SIZE = 64
STREAM_QUEUE_INITIAL_CAPACITY = 128
ORPHAN_QUEUE_INITIAL_CAPACITY = 64
DNS_RESPONSE_FRAGMENT_STORE_CAPACITY = 256
SOCKS_UDP_ASSOCIATE_READ_TIMEOUT_SECONDS = 30.0
CLIENT_TERMINAL_STREAM_RETENTION_SECONDS = 30.0
CLIENT_CANCELLED_SETUP_RETENTION_SECONDS = 60.0
SESSION_INIT_RETRY_BASE_SECONDS = 1.0
SESSION_INIT_RETRY_STEP_SECONDS = 1.0
SESSION_INIT_RETRY_LINEAR_AFTER = 3
SESSION_INIT_RETRY_MAX_SECONDS = 30.0
SESSION_INIT_BUSY_RETRY_INTERVAL_SECONDS = 30.0
# Balanced ping interval for stability without excessive data usage.
PING_AGGRESSIVE_INTERVAL_SECONDS = 0.400
PING_LAZY_INTERVAL_SECONDS = 0.400
PING_COOLDOWN_INTERVAL_SECONDS = 1.5
PING_COLD_INTERVAL_SECONDS = 12.0
PING_WARM_THRESHOLD_SECONDS = 3.0
PING_COOL_THRESHOLD_SECONDS = 8.0
PING_COLD_THRESHOLD_SECONDS = 15.0
# ------------------------------------------------------------------------------
# 8) ARQ Reliability & Packing
# ------------------------------------------------------------------------------
MAX_PACKETS_PER_BATCH = 45
ARQ_WINDOW_SIZE = 4000
ARQ_INITIAL_RTO_SECONDS = 0.2
ARQ_MAX_RTO_SECONDS = 1.5
ARQ_CONTROL_INITIAL_RTO_SECONDS = 0.4
ARQ_CONTROL_MAX_RTO_SECONDS = 2.0
ARQ_MAX_CONTROL_RETRIES = 200
ARQ_INACTIVITY_TIMEOUT_SECONDS = 1800.0
ARQ_DATA_PACKET_TTL_SECONDS = 2400.0
ARQ_CONTROL_PACKET_TTL_SECONDS = 1200.0
ARQ_MAX_DATA_RETRIES = 2000
ARQ_DATA_NACK_MAX_GAP = 64
ARQ_DATA_NACK_INITIAL_DELAY_SECONDS = 0.5
ARQ_DATA_NACK_REPEAT_SECONDS = 0.5
ARQ_TERMINAL_DRAIN_TIMEOUT_SECONDS = 120.0
ARQ_TERMINAL_ACK_WAIT_TIMEOUT_SECONDS = 90.0
# ------------------------------------------------------------------------------
# 9) Logging
# ------------------------------------------------------------------------------
LOG_LEVEL = "INFO"
