# Server and Client settings update file

# Optimized for low-end servers and clients

# Provides balanced speed and stability under current conditions

# Extremely high resolver scan speed and accuracy

# Reasonable internet usage and low resource consumption

# Client specifications: 2 cores, 2GB RAM

# Server specifications: 1 core, 1GB RAM

# ==============================================================================
# MasterDnsVPN Go Server Configuration (Nima optimazation)
# ==============================================================================
# ------------------------------------------------------------------------------
# 1) Tunnel Policy
# ------------------------------------------------------------------------------
DOMAIN = [""]
PROTOCOL_TYPE = "SOCKS5"
SUPPORTED_UPLOAD_COMPRESSION_TYPES = [1]
SUPPORTED_DOWNLOAD_COMPRESSION_TYPES = [1]
# ------------------------------------------------------------------------------
# 2) UDP Listener & Front-Door Capacity
# ------------------------------------------------------------------------------
UDP_HOST = "0.0.0.0"
UDP_PORT = 53
UDP_READERS = 8
DNS_REQUEST_WORKERS = 8
MAX_CONCURRENT_REQUESTS = 512
SOCKET_BUFFER_SIZE = 20971520
MAX_PACKET_SIZE = 65535
DROP_LOG_INTERVAL_SECONDS = 2.0
# ------------------------------------------------------------------------------
# 3) Deferred Session Runtime
# ------------------------------------------------------------------------------
DEFERRED_SESSION_WORKERS = 6
DEFERRED_SESSION_QUEUE_LIMIT = 896
SESSION_ORPHAN_QUEUE_INITIAL_CAPACITY = 96
STREAM_QUEUE_INITIAL_CAPACITY = 192
DNS_FRAGMENT_STORE_CAPACITY = 384   
SOCKS5_FRAGMENT_STORE_CAPACITY = 512
# ------------------------------------------------------------------------------
# 4) Session Lifecycle (Ultra Stable)
# ------------------------------------------------------------------------------
INVALID_COOKIE_WINDOW_SECONDS = 2.0
INVALID_COOKIE_ERROR_THRESHOLD = 10
SESSION_TIMEOUT_SECONDS = 2400.0
SESSION_CLEANUP_INTERVAL_SECONDS = 30.0
CLOSED_SESSION_RETENTION_SECONDS = 1200.0
SESSION_INIT_REUSE_TTL_SECONDS = 2400.0
RECENTLY_CLOSED_STREAM_TTL_SECONDS = 1200.0
RECENTLY_CLOSED_STREAM_CAP = 5000
TERMINAL_STREAM_RETENTION_SECONDS = 120.0
# ------------------------------------------------------------------------------
# 5) DNS Tunnel Upstream
# ------------------------------------------------------------------------------
DNS_UPSTREAM_SERVERS = ["1.1.1.1:53", "1.0.0.1:53", "8.8.8.8:53"]
DNS_UPSTREAM_TIMEOUT = 6.0
DNS_INFLIGHT_WAIT_TIMEOUT_SECONDS = 45.0
DNS_FRAGMENT_ASSEMBLY_TIMEOUT = 450.0
DNS_CACHE_MAX_RECORDS = 85000
DNS_CACHE_TTL_SECONDS = 600.0
# ------------------------------------------------------------------------------
# 6) Upstream SOCKS / Forwarding
# ------------------------------------------------------------------------------
SOCKS_CONNECT_TIMEOUT = 180.0
USE_EXTERNAL_SOCKS5 = false
SOCKS5_AUTH = false
SOCKS5_USER = "admin"
SOCKS5_PASS = "123456"
FORWARD_IP = ""
FORWARD_PORT = 0
# ------------------------------------------------------------------------------
# 7) Security
# ------------------------------------------------------------------------------
DATA_ENCRYPTION_METHOD = 1
ENCRYPTION_KEY_FILE = "encrypt_key.txt"
# ------------------------------------------------------------------------------
# 8) ARQ, Packing, and Setup-Control TTLs (Ultra Performance)
# ------------------------------------------------------------------------------
MAX_PACKETS_PER_BATCH = 900
PACKET_BLOCK_CONTROL_DUPLICATION = 4
STREAM_SETUP_ACK_TTL_SECONDS = 1600.0
STREAM_RESULT_PACKET_TTL_SECONDS = 1200.0
STREAM_FAILURE_PACKET_TTL_SECONDS = 300.0   
# ARQ Ultra Performance
ARQ_WINDOW_SIZE = 2500
ARQ_INITIAL_RTO_SECONDS = 0.25
ARQ_MAX_RTO_SECONDS = 12.0
ARQ_CONTROL_INITIAL_RTO_SECONDS = 0.3
ARQ_CONTROL_MAX_RTO_SECONDS = 6.0
ARQ_MAX_CONTROL_RETRIES = 4000
ARQ_INACTIVITY_TIMEOUT_SECONDS = 7200.0
ARQ_DATA_PACKET_TTL_SECONDS = 12000.0
ARQ_CONTROL_PACKET_TTL_SECONDS = 6000.0
ARQ_MAX_DATA_RETRIES = 30000
ARQ_DATA_NACK_MAX_GAP = 128
ARQ_DATA_NACK_REPEAT_SECONDS = 0.2
ARQ_TERMINAL_DRAIN_TIMEOUT_SECONDS = 360.0
ARQ_TERMINAL_ACK_WAIT_TIMEOUT_SECONDS = 300.0
# ------------------------------------------------------------------------------
# 9) Logging
# ------------------------------------------------------------------------------
LOG_LEVEL = "INFO"
# ------------------------------------------------------------------------------
CONFIG_VERSION = "10"
